# Runs the tests on Windows and macOS on every push and pull request,
# and checks that the Mac app still builds.
name: CI

on:
  push:
    branches: [main, mac-support]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Run tests
        run: cargo test --workspace

      - name: Build the Mac app
        if: runner.os == 'macOS'
        working-directory: app
        run: npx tauri build --bundles app
