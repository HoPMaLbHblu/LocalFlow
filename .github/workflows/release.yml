# Builds the Windows installers and the Mac disk image and attaches them to a GitHub release.
# Triggered by pushing a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          # One app for both Apple Silicon and Intel Macs.
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # The desktop crate embeds app/dist when it compiles, so build it before testing.
      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Run tests
        run: cargo test --workspace

      - name: Build installers and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: LocalFlow ${{ github.ref_name }}
          releaseBody: |
            **Windows:** download **LocalFlow_x.y.z_x64-setup.exe** below and run it.
            **Mac:** download **LocalFlow_x.y.z_universal.dmg**, open it and drag LocalFlow into Applications. The first time, right-click LocalFlow in Applications and choose **Open** (it isn't notarized by Apple yet).
            See the README for what's new and how to use it.
          releaseDraft: false
          prerelease: false
