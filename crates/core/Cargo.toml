[package]
name = "localflow-core"
description = "LocalFlow engine: database, sandboxed Lua runtime and scheduler."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
sqlx.workspace = true
mlua.workspace = true
serde.workspace = true
tokio-cron-scheduler.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
dirs.workspace = true
uuid.workspace = true
notify = "8"
sysinfo = "0.37"
open = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
serde_json.workspace = true
sha2 = "0.10"
trash = "5"
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
kamadak-exif = "0.6"
csv = "1.3"
chacha20poly1305 = "0.10"
argon2 = "0.5"
getrandom = "0.2"
# GigaChat's servers use the Russian Trusted Root CA, trusted only for GigaChat's own connection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }

# Keyboard and mouse control on Windows and macOS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
enigo = "0.3"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Shutdown"] }

[dev-dependencies]
tempfile.workspace = true
sqlx.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
