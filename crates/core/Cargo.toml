[package]
name = "localflow-core"
description = "LocalFlow engine: database, sandboxed Lua runtime and scheduler."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
sqlx.workspace = true
mlua.workspace = true
serde.workspace = true
tokio-cron-scheduler.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
dirs.workspace = true
uuid.workspace = true
notify = "8"
sysinfo = "0.37"
open = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
serde_json.workspace = true
sha2 = "0.10"
trash = "5"
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
kamadak-exif = "0.6"
csv = "1.3"
chacha20poly1305 = "0.10"
argon2 = "0.5"
getrandom = "0.2"
# GigaChat's servers use the Russian Trusted Root CA, trusted only for GigaChat's own connection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
# Voice control engine (feature `voice-engine`, off by default): microphone capture, voice activity
# detection and offline speech recognition. bzip2 uses the pure-Rust backend (no C toolchain).
cpal = { version = "0.18", optional = true }
sherpa-onnx = { version = "1.13.8", optional = true }
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }

[features]
default = []
voice-engine = ["dep:cpal", "dep:sherpa-onnx", "dep:bzip2", "dep:tar"]

# Keyboard and mouse control on Windows and macOS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
enigo = "0.3"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Shutdown", "Win32_System_Registry"] }
# Exact volume through Windows' audio API (the same version Tauri uses).
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"] }

[dev-dependencies]
tempfile.workspace = true
sqlx.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
