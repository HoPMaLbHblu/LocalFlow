[package]
name = "localflow-desktop"
description = "LocalFlow desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "localflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
localflow-core.workspace = true
# TODO(lead): after merging the engine agent's work, enable the real speech engine:
# localflow-core = { workspace = true, features = ["voice-engine"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
rfd = { version = "0.15", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
open = "5"
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
dirs.workspace = true
# The GigaChat key lives in Windows Credential Manager / the macOS Keychain.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
sys-locale = "0.3"
